<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Постомат СИЗ</title><style>
:root{--b:#1263b6;--bd:#0c4d91;--bg:#eef3f8;--ink:#1c2a3a;--m:#6b7788;--line:#d8e0e9;--g:#188458;--o:#c77a16;--r:#b33a3a}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:19px}.tag{font-size:11px;padding:6px 9px;background:#fff1c7;color:#7a5900;border-radius:999px;font-weight:800}.sp{flex:1}.btn{height:42px;border:0;border-radius:11px;padding:0 14px;font-weight:800;background:#e6edf5;color:#243247}.btn.p{background:var(--b);color:#fff}.btn.g{background:var(--g);color:#fff}.btn.r{background:var(--r);color:#fff}.btn.o{background:#fff;border:1px solid var(--line)}.wrap{padding:14px}.hero{background:linear-gradient(135deg,var(--bd),var(--b));color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}.hero h1{font-size:23px;margin:0}.hero p{margin:6px 0 0;color:#dbeaff}.beta{background:#fff4cf;border:1px solid #f0d27d;color:#785b00;border-radius:13px;padding:11px 13px;font-size:12px;font-weight:800;margin-bottom:12px}.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}.sel{height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 12px;min-width:220px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi b{font-size:25px;display:block}.kpi span{font-size:11px;color:var(--m)}h2{font-size:20px;margin:0 0 6px}.sub{color:var(--m);font-size:12px;line-height:1.45}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.field{margin-top:10px}.field label{font-size:11px;font-weight:800;display:block;margin-bottom:5px}.inp,.select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 11px;background:#fff}.tablew{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:13px}.table{border-collapse:collapse;width:100%;min-width:780px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;vertical-align:top}.table th{background:#f6f8fb;color:#5b6778}.pill{font-size:10px;font-weight:800;border-radius:999px;padding:5px 8px;background:#eaf6f0;color:var(--g)}.pill.warn{background:#fff0da;color:var(--o)}.pill.err{background:#fde7e7;color:var(--r)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.small{height:34px;font-size:11px;padding:0 10px}.empty{text-align:center;color:var(--m);padding:28px}.login{height:100%;display:grid;place-items:center;padding:20px}.loginbox{width:min(460px,96vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pin button{height:56px}.pinview{height:58px;border:2px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;letter-spacing:10px;margin:12px 0}.modalbg{position:fixed;inset:0;background:rgba(14,25,39,.55);display:none;align-items:flex-end;z-index:50}.modalbg.show{display:flex}.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow:auto;padding:18px}.modal h3{margin:0}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;right:16px;bottom:16px;background:#172033;color:#fff;border-radius:10px;padding:11px 13px;opacity:0;pointer-events:none;z-index:80;max-width:420px}.toast.show{opacity:1}.toast.err{background:#9d3333}.toast.ok{background:#18754e}.section{font-size:12px;font-weight:900;color:#49576b;text-transform:uppercase;margin:15px 2px 7px}.bar{height:7px;border-radius:99px;background:#e5ebf1;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}@media(max-width:800px){.grid4{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:10px}.top{padding:0 10px}.brand{font-size:16px}.sel{min-width:0;flex:1}.table{min-width:900px}}
</style></head><body><div id="app"></div><div id="modalbg" class="modalbg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div><script>
const K='POSTOMAT_SIZ_STD_ADMIN_V3';let db,session={admin:false};let pin='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),now=()=>new Date().toISOString(),fmt=x=>new Date(x).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
function defaults(){return{employees:[{id:'E1',name:'Погорельский А.',pin:'0000',cellId:1,active:true},{id:'WH',name:'Склад',pin:'9000',active:true}],cells:[{id:1,name:'Ячейка №1',active:true,type:'INDIVIDUAL'}],ppe:[{id:'P1',name:'Перчатки с обливом',unit:'шт.',active:true},{id:'P2',name:'Маркер тонкий',unit:'шт.',active:true},{id:'P3',name:'Чаша зачистная',unit:'шт.',active:true},{id:'P4',name:'Антипригарный спрей',unit:'шт.',active:true},{id:'P5',name:'Ножи для BAS',unit:'шт.',active:true}],assignments:[{id:'A1',employeeId:'E1',cellId:1,ppeId:'P1',stock:2,min:2,max:4,issueQty:1,periodDays:30,active:true}],issueLog:[],replenishLog:[],audit:[],sim:{'1':'CLOSED'},settings:{criticalHours:2,normalHours:24,reportRetentionMonths:12,backupWeeks:12,backupDays:7},archive:{reports:[],backups:[]}}}
function load(){try{db=JSON.parse(localStorage.getItem(K))||defaults()}catch(e){db=defaults()}migrate()}function migrate(){db.archive=db.archive||{reports:[],backups:[]};db.issueLog=db.issueLog||[];db.replenishLog=db.replenishLog||[];db.audit=db.audit||[];db.sim=db.sim||{};(db.assignments||[]).forEach(a=>{if(a.max==null)a.max=a.target==null?2:a.target;if(a.issueQty==null)a.issueQty=1;if(a.periodDays==null)a.periodDays=30})}function save(){localStorage.setItem(K,JSON.stringify(db))}function aud(a,b='',c=''){db.audit.unshift({ts:now(),admin:'Администратор',action:a,before:String(b),after:String(c)});save()}function emp(id){return db.employees.find(x=>x.id===id)}function ppe(id){return db.ppe.find(x=>x.id===id)}function toast(t,k=''){let x=$('toast');x.textContent=t;x.className='toast show '+k;setTimeout(()=>x.className='toast',2400)}
function login(){document.body.innerHTML='<div id="app"></div><div id="modalbg" class="modalbg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>'; $('app').innerHTML=`<div class="login"><div class="loginbox"><h2>Постомат СИЗ</h2><p class="sub">Вход в панель администратора</p><div id="pv" class="pinview">—</div><div class="pin">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" data-d="${n}">${n}</button>`).join('')}<button class="btn r" id="clr">СБРОС</button><button class="btn" data-d="0">0</button><button class="btn p" id="enter">ВОЙТИ</button></div><p class="sub">Тестовый PIN администратора: 1111</p></div></div>`;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(pin.length<8)pin+=b.dataset.d;updPin()});$('clr').onclick=()=>{pin='';updPin()};$('enter').onclick=()=>{if(pin==='1111'){session.admin=true;show('overview')}else{toast('Неверный PIN','err');pin='';updPin()}}}function updPin(){$('pv').textContent=pin?'•'.repeat(pin.length):'—'}
const sections=[['overview','Обзор'],['reports','Отчёты'],['employees','Сотрудники'],['cells','Ячейки'],['ppe','СИЗ'],['assign','Назначения'],['stock','Остатки'],['issues','Выдача'],['repl','Пополнения'],['cons','Потребление'],['audit','Изменения'],['sim','Эмулятор'],['settings','Настройки']];
function shell(tab,body){$('app').innerHTML=`<div class="top"><div class="brand">Постомат СИЗ</div><span class="tag">ДЕМО — реальные ячейки не открываются</span><div class="sp"></div><button class="btn o" id="logout">Выйти</button></div><div class="wrap"><div class="hero"><h1>Панель администратора</h1><p>Центр управления системой постамата СИЗ</p></div><div class="nav"><select id="nav" class="sel">${sections.map(x=>`<option value="${x[0]}" ${x[0]===tab?'selected':''}>Раздел — ${x[1]}</option>`).join('')}</select></div>${body}</div>`;$('logout').onclick=()=>{session.admin=false;pin='';login()};$('nav').onchange=e=>show(e.target.value);wire(tab)}
function header(t,s,a=''){return `<div class="row" style="margin-bottom:10px"><div class="grow"><h2>${t}</h2><div class="sub">${s}</div></div>${a}</div>`}
function show(tab){if(!session.admin)return login();let b='';if(tab==='overview')b=overview();if(tab==='reports')b=reports();if(tab==='employees')b=employees();if(tab==='cells')b=cells();if(tab==='ppe')b=ppes();if(tab==='assign')b=assigns();if(tab==='stock')b=stock();if(tab==='issues')b=issues();if(tab==='repl')b=repl();if(tab==='cons')b=cons();if(tab==='audit')b=audit();if(tab==='sim')b=sim();if(tab==='settings')b=settings();shell(tab,b)}
function overview(){let ae=db.employees.filter(x=>x.active&&x.id!=='WH'),ac=db.cells.filter(x=>x.active),ap=db.ppe.filter(x=>x.active),low=db.assignments.filter(a=>a.active&&a.stock<=a.min),freeU=ae.filter(e=>!e.cellId),freeC=ac.filter(c=>!ae.some(e=>+e.cellId===+c.id)),noP=ae.filter(e=>!db.assignments.some(a=>a.active&&a.employeeId===e.id));return `<div class="grid4"><div class="card kpi"><b>${ae.length}</b><span>Пользователи</span></div><div class="card kpi"><b>${ac.length}</b><span>Ячейки</span></div><div class="card kpi"><b>${ap.length}</b><span>Список СИЗ</span></div><div class="card kpi"><b>${low.length}</b><span>Требует пополнения</span></div><div class="card kpi"><b>${freeU.length}</b><span>Свободные пользователи</span></div><div class="card kpi"><b>${noP.length}</b><span>Пользователи без СИЗ</span></div><div class="card kpi"><b>${freeC.length}</b><span>Свободные ячейки</span></div><div class="card kpi"><b>0</b><span>Ошибки связей</span></div></div><div class="card"><h2>Сотрудники и их оснащение</h2><p class="sub">Список открывается по кнопке и не занимает обзор постоянно.</p><button class="btn o" id="equip">Открыть список</button></div>`}
function employees(){return header('Сотрудники','Пользователи и привязка к индивидуальным ячейкам','<button class="btn p" id="addE">+ Пользователь</button>')+db.employees.filter(e=>e.id!=='WH').map(e=>`<div class="card"><div class="row"><b class="grow">${esc(e.name)}</b><span class="pill">${e.active?'АКТИВЕН':'ОТКЛЮЧЕН'}</span></div><div class="sub">Ячейка: ${e.cellId?'№'+e.cellId:'не назначена'}</div><div class="actions"><button class="btn small o" data-ee="${e.id}">Изменить</button><button class="btn small" data-te="${e.id}">${e.active?'Отключить':'Включить'}</button></div></div>`).join('')}
function cells(){return header('Ячейки','Индивидуальные ячейки. Общие ячейки пока скрыты.','<button class="btn p" id="addC">+ Ячейка</button>')+db.cells.map(c=>`<div class="card"><div class="row"><b class="grow">${esc(c.name)} • BID ${c.id}</b><span class="pill">${c.active?'АКТИВНА':'ОТКЛЮЧЕНА'}</span></div><div class="sub">Владелец: ${esc((db.employees.find(e=>+e.cellId===+c.id&&e.active)||{}).name||'не назначен')}</div><div class="actions"><button class="btn small o" data-ec="${c.id}">Изменить</button><button class="btn small" data-tc="${c.id}">${c.active?'Отключить':'Включить'}</button></div></div>`).join('')}
function ppes(){return header('СИЗ','Справочник СИЗ. Позиции отключаются, но история не удаляется.','<button class="btn p" id="addP">+ СИЗ</button>')+db.ppe.map(p=>`<div class="card"><div class="row"><b class="grow">${esc(p.name)}</b><span class="pill">${p.active?'АКТИВЕН':'ОТКЛЮЧЕН'}</span></div><div class="sub">Ед.: ${esc(p.unit||'шт.')}</div><div class="actions"><button class="btn small o" data-ep="${p.id}">Изменить</button><button class="btn small" data-tp="${p.id}">${p.active?'Отключить':'Включить'}</button></div></div>`).join('')}
function acard(a,stockMode=false){let e=emp(a.employeeId),p=ppe(a.ppeId),pct=Math.min(100,a.max?Math.round(a.stock/a.max*100):0),cls=a.stock===0?'err':a.stock<=a.min?'warn':'';return `<div class="card"><div class="row"><b class="grow">${esc(e?.name||'—')} • ${esc(p?.name||'—')}</b><span class="pill ${cls}">${a.stock===0?'НЕТ':a.stock<=a.min?'ПОПОЛНИТЬ':'НОРМА'}</span></div><div class="sub">Ячейка №${a.cellId} • Разово к получению: ${a.issueQty} • Плановая эксплуатация: ${a.periodDays} дн. • Min ${a.min} • Max ${a.max}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="sub" style="margin-top:5px">Остаток: <b>${a.stock}</b></div><div class="actions"><button class="btn small o" data-ea="${a.id}">Изменить</button>${stockMode?`<button class="btn small p" data-sc="${a.id}">Корректировать остаток</button>`:''}</div></div>`}
function assigns(){return header('Назначения','Сотрудник ↔ Ячейка ↔ СИЗ ↔ Разово к получению ↔ Плановая эксплуатация ↔ Min/Max','<button class="btn p" id="addA">+ Назначение</button>')+db.assignments.filter(a=>a.active).map(a=>acard(a)).join('')}
function stock(){return header('Остатки','Фактический остаток изменяется выдачами, пополнениями или явной корректировкой.')+db.assignments.filter(a=>a.active).map(a=>acard(a,true)).join('')}
function issues(){let r=db.issueLog.map(x=>`<tr><td>${fmt(x.ts)}</td><td>${esc(x.userName)}</td><td>№${x.cellId}</td><td>${esc(x.ppeName)}</td><td>${x.before}</td><td><b>${x.qty}</b></td><td>${x.after}</td><td>${esc(x.issueType||'Обычная')}</td><td>${esc(x.earlyReason||'—')}</td><td>${esc(x.status||'Подтверждено')}</td></tr>`).join('');return header('Журнал выдачи','Дата | Пользователь | Ячейка | СИЗ | Было | Взято | Осталось | Тип выдачи | Причина | Статус')+`<div class="tablew"><table class="table"><thead><tr><th>Дата/время</th><th>Пользователь</th><th>Ячейка</th><th>СИЗ</th><th>Было</th><th>Взято</th><th>Осталось</th><th>Тип выдачи</th><th>Причина досрочного получения СИЗ</th><th>Статус</th></tr></thead><tbody>${r||'<tr><td colspan="10" class="empty">Выдач нет</td></tr>'}</tbody></table></div>`}
function repl(){let r=db.replenishLog.map(x=>`<tr><td>${fmt(x.ts)}</td><td>${esc(x.recipientName||'—')}</td><td>${esc(x.issuedBy||'Склад')}</td><td>${esc(x.ppeName)}</td><td><b>${x.qty}</b></td><td>${x.after}</td></tr>`).join('');return header('Журнал склада','Дата | Время | Получатель | Выдал | СИЗ | Выдано | Остаток в ячейке')+`<div class="tablew"><table class="table"><thead><tr><th>Дата/время</th><th>Получатель</th><th>Выдал</th><th>СИЗ</th><th>Выдано</th><th>Остаток в ячейке</th></tr></thead><tbody>${r||'<tr><td colspan="6" class="empty">Операций склада нет</td></tr>'}</tbody></table></div>`}
function cons(){let from=Date.now()-30*864e5,r=db.ppe.filter(p=>p.active).map(p=>{let q=db.issueLog.filter(x=>x.ppeId===p.id&&+new Date(x.ts)>=from).reduce((s,x)=>s+x.qty,0),rep=db.replenishLog.filter(x=>x.ppeId===p.id&&+new Date(x.ts)>=from).reduce((s,x)=>s+x.qty,0),st=db.assignments.filter(a=>a.active&&a.ppeId===p.id).reduce((s,a)=>s+a.stock,0);return `<tr><td>${esc(p.name)}</td><td>${q}</td><td>${rep}</td><td>${st}</td><td>${(q/30).toFixed(2)}</td></tr>`}).join('');return header('Потребление','Последние 30 дней')+`<div class="tablew"><table class="table"><thead><tr><th>СИЗ</th><th>Выдано</th><th>Пополнено</th><th>Остаток</th><th>Среднее/день</th></tr></thead><tbody>${r}</tbody></table></div>`}
function audit(){let r=db.audit.map(x=>`<tr><td>${fmt(x.ts)}</td><td>${esc(x.admin)}</td><td>${esc(x.action)}</td><td>${esc(x.before)}</td><td>${esc(x.after)}</td></tr>`).join('');return header('Журнал изменений','Изменения справочников и ручных остатков')+`<div class="tablew"><table class="table"><thead><tr><th>Дата/время</th><th>Администратор</th><th>Изменение</th><th>Было</th><th>Стало</th></tr></thead><tbody>${r||'<tr><td colspan="5" class="empty">Изменений нет</td></tr>'}</tbody></table></div>`}
function sim(){return header('Эмулятор','Ни одна кнопка не обращается к реальному постомату.','<button class="btn o" id="demoOps">Создать демо-операции</button>')+db.cells.filter(c=>c.active).map(c=>`<div class="card"><div class="row"><b class="grow">${esc(c.name)} • BID ${c.id}</b><span class="pill ${db.sim[c.id]==='OPEN'?'warn':''}">${db.sim[c.id]||'CLOSED'}</span></div><div class="actions"><button class="btn small p" data-open="${c.id}">Открыть виртуально</button><button class="btn small g" data-close="${c.id}">Закрыть</button></div></div>`).join('')}
function settings(){return header('Настройки','Параметры административной БЕТА-версии.')+`<div class="beta">Режим связи: <b>ДЕМО</b>. Сетевые команды к 10.10.10.1 отсутствуют.</div><div class="card"><div class="field"><label>Срок критичного пополнения, ч</label><input id="crit" class="inp" type="number" value="${db.settings.criticalHours}"></div><div class="field"><label>Обычный срок пополнения, ч</label><input id="norm" class="inp" type="number" value="${db.settings.normalHours}"></div><div class="actions"><button class="btn p" id="saveSet">Сохранить</button><button class="btn r" id="reset">Сбросить БЕТА-данные</button></div></div>`}
function folderReady(){try{return !!NativeStore.hasRootFolder()}catch(e){return false}}function folderLabel(){try{return NativeStore.getRootFolderLabel()}catch(e){return 'Папка не выбрана'}}function chooseFolder(){try{NativeStore.chooseRootFolder()}catch(e){toast('Выбор папки недоступен','err')}}function onNativeFolderSelected(){toast('Папка хранения подключена','ok');show('reports')}
function reports(){let fr=folderReady();return header('Отчёты','Еженедельный и ежемесячный отчёт формируются как один лист.')+`<div class="beta">Стандартная Android-сборка. Файлы сохраняются через системный доступ к выбранной папке.</div><div class="grid"><div class="card"><h2>Папка хранения</h2><p class="sub">Выберите Documents или Postomat_SIZ. Внутри будут созданы Postomat_SIZ/Reports и Postomat_SIZ/Backup.</p><div class="pill ${fr?'':'warn'}">${esc(folderLabel())}</div><div class="actions"><button class="btn p" id="folder">ВЫБРАТЬ ПАПКУ ХРАНЕНИЯ</button></div></div><div class="card"><h2>Еженедельный отчёт</h2><p class="sub">Ключевые показатели → СИЗ → внимание → выдачи → пополнения.</p><button class="btn p" id="week">СФОРМИРОВАТЬ XLSX</button></div><div class="card"><h2>Ежемесячный отчёт</h2><p class="sub">Ключевые показатели → СИЗ → сотрудники → отклонения → выдачи → пополнения → корректировки.</p><button class="btn p" id="month">СФОРМИРОВАТЬ XLSX</button></div><div class="card"><h2>Резервные копии</h2><p class="sub">Ручной backup сохраняется физическим JSON-файлом.</p><button class="btn g" id="backup">СОЗДАТЬ BACKUP</button></div><div class="card"><h2>Отправить отчёт на Email</h2><div class="field"><label>Email</label><input id="email" class="inp" placeholder="name@company.kz"></div><button class="btn p" id="emailBtn">ОТПРАВИТЬ ОТЧЁТ НА EMAIL</button><p class="sub">Почтовый модуль ещё не подключён. Успешная отправка не имитируется.</p></div></div><div class="section">Архив</div>${db.archive.reports.map(r=>`<div class="card"><b>${esc(r.name)}</b><div class="sub">${fmt(r.ts)} • ${esc(r.path||'')}</div></div>`).join('')||'<div class="empty">Архив пуст</div>'}`}
function modal(html,cb){$('modal').innerHTML=html;$('modalbg').classList.add('show');if(cb)cb()}function closeM(){$('modalbg').classList.remove('show')}$('modalbg').onclick=e=>{if(e.target===$('modalbg'))closeM()};
function empModal(e){let opts='<option value="">Не назначена</option>'+db.cells.filter(c=>c.active).map(c=>`<option value="${c.id}" ${+e?.cellId===+c.id?'selected':''}>№${c.id}</option>`).join('');modal(`<h3>${e?'Изменить пользователя':'Новый пользователь'}</h3><div class="field"><label>Фамилия / имя</label><input id="mn" class="inp" value="${esc(e?.name||'')}"></div><div class="field"><label>PIN</label><input id="mpin" class="inp" value="${esc(e?.pin||'')}"></div><div class="field"><label>Ячейка</label><select id="mc" class="select">${opts}</select></div><div class="footer"><button class="btn o" id="cancel">Отмена</button><button class="btn p" id="ms">Сохранить</button></div>`,()=>{$('cancel').onclick=closeM;$('ms').onclick=()=>{let n=$('mn').value.trim(),p=$('mpin').value.trim(),c=+$('mc').value||null;if(!n||!p)return toast('Заполните имя и PIN','err');if(c&&db.employees.some(x=>x.active&&+x.cellId===c&&x.id!==e?.id))return toast('Ячейка занята','err');if(e){let old=JSON.stringify(e);let oc=e.cellId;e.name=n;e.pin=p;e.cellId=c;db.assignments.filter(a=>a.active&&a.employeeId===e.id).forEach(a=>a.cellId=c);aud('Изменён пользователь',old,JSON.stringify(e))}else{let x={id:uid('E'),name:n,pin:p,cellId:c,active:true};db.employees.push(x);aud('Создан пользователь','',JSON.stringify(x))}save();closeM();show('employees')}})}
function cellModal(c){modal(`<h3>${c?'Изменить ячейку':'Новая ячейка'}</h3><div class="field"><label>BID</label><input id="cid" class="inp" type="number" value="${c?.id||''}" ${c?'disabled':''}></div><div class="field"><label>Название</label><input id="cn" class="inp" value="${esc(c?.name||'')}"></div><div class="footer"><button class="btn o" id="cancel">Отмена</button><button class="btn p" id="ms">Сохранить</button></div>`,()=>{$('cancel').onclick=closeM;$('ms').onclick=()=>{let id=c?c.id:+$('cid').value,n=$('cn').value.trim()||'Ячейка №'+id;if(!id)return toast('Укажите BID','err');if(!c&&db.cells.some(x=>+x.id===id))return toast('BID уже существует','err');if(c){let o=JSON.stringify(c);c.name=n;aud('Изменена ячейка',o,JSON.stringify(c))}else{let x={id,name:n,type:'INDIVIDUAL',active:true};db.cells.push(x);db.sim[id]='CLOSED';aud('Создана ячейка','',JSON.stringify(x))}save();closeM();show('cells')}})}
function ppeModal(p){modal(`<h3>${p?'Изменить СИЗ':'Новый СИЗ'}</h3><div class="field"><label>Наименование</label><input id="pn" class="inp" value="${esc(p?.name||'')}"></div><div class="field"><label>Ед.</label><input id="pu" class="inp" value="${esc(p?.unit||'шт.')}"></div><div class="footer"><button class="btn o" id="cancel">Отмена</button><button class="btn p" id="ms">Сохранить</button></div>`,()=>{$('cancel').onclick=closeM;$('ms').onclick=()=>{let n=$('pn').value.trim(),u=$('pu').value.trim()||'шт.';if(!n)return toast('Введите наименование','err');if(p){let o=JSON.stringify(p);p.name=n;p.unit=u;aud('Изменён СИЗ',o,JSON.stringify(p))}else{let x={id:uid('P'),name:n,unit:u,active:true};db.ppe.push(x);aud('Добавлен СИЗ','',JSON.stringify(x))}save();closeM();show('ppe')}})}
function assignModal(a){let eo=db.employees.filter(e=>e.active&&e.id!=='WH'&&e.cellId).map(e=>`<option value="${e.id}" ${a?.employeeId===e.id?'selected':''}>${esc(e.name)} • №${e.cellId}</option>`).join(''),po=db.ppe.filter(p=>p.active).map(p=>`<option value="${p.id}" ${a?.ppeId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');modal(`<h3>${a?'Изменить назначение':'Новое назначение'}</h3><div class="field"><label>Пользователь</label><select id="ae" class="select">${eo}</select></div><div class="field"><label>СИЗ</label><select id="ap" class="select">${po}</select></div><div class="grid"><div class="field"><label>Разово к получению</label><input id="ai" class="inp" type="number" value="${a?.issueQty??1}"></div><div class="field"><label>Плановая эксплуатация, дней</label><input id="ad" class="inp" type="number" value="${a?.periodDays??30}"></div><div class="field"><label>Min</label><input id="amin" class="inp" type="number" value="${a?.min??1}"></div><div class="field"><label>Max</label><input id="amax" class="inp" type="number" value="${a?.max??2}"></div>${a?'':`<div class="field"><label>Начальный остаток</label><input id="ast" class="inp" type="number" value="0"></div>`}</div><div class="footer"><button class="btn o" id="cancel">Отмена</button><button class="btn p" id="ms">Сохранить</button></div>`,()=>{$('cancel').onclick=closeM;$('ms').onclick=()=>{let eid=$('ae').value,e=emp(eid),pid=$('ap').value,iq=Math.max(1,+$('ai').value||1),pd=Math.max(0,+$('ad').value||0),mi=Math.max(0,+$('amin').value||0),ma=Math.max(1,+$('amax').value||1);if(ma<mi)return toast('Max не может быть меньше Min','err');if(db.assignments.some(x=>x.active&&x.employeeId===eid&&x.ppeId===pid&&x.id!==a?.id))return toast('Этот СИЗ уже назначен','err');if(a){let o=JSON.stringify(a);Object.assign(a,{employeeId:eid,cellId:e.cellId,ppeId:pid,issueQty:iq,periodDays:pd,min:mi,max:ma});aud('Изменено назначение',o,JSON.stringify(a))}else{let x={id:uid('A'),employeeId:eid,cellId:e.cellId,ppeId:pid,issueQty:iq,periodDays:pd,min:mi,max:ma,stock:Math.max(0,+$('ast').value||0),active:true};db.assignments.push(x);aud('Создано назначение','',JSON.stringify(x))}save();closeM();show('assign')}})}
function stockModal(a){modal(`<h3>Корректировка остатка</h3><p class="sub">${esc(emp(a.employeeId)?.name)} • ${esc(ppe(a.ppeId)?.name)} • №${a.cellId}</p><div class="field"><label>Фактический остаток</label><input id="sq" class="inp" type="number" value="${a.stock}"></div><div class="field"><label>Причина</label><input id="sr" class="inp" placeholder="Инвентаризация, ошибка учёта…"></div><div class="footer"><button class="btn o" id="cancel">Отмена</button><button class="btn p" id="ms">Сохранить</button></div>`,()=>{$('cancel').onclick=closeM;$('ms').onclick=()=>{let q=Math.max(0,+$('sq').value||0),r=$('sr').value.trim();if(!r)return toast('Укажите причину','err');let old=a.stock;a.stock=q;aud('Корректировка остатка',old,q+'; '+r);save();closeM();show('stock')}})}
function xml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}let crct;function crc(b){if(!crct){crct=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;crct[n]=c>>>0}}let c=0xffffffff;for(let x of b)c=crct[(c^x)&255]^(c>>>8);return(c^0xffffffff)>>>0}function u16(n){return new Uint8Array([n&255,n>>>8&255])}function u32(n){return new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255])}function cat(a){let n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n),p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o}function zip(files){let out=[],cen=[],off=0,te=new TextEncoder();for(let f of files){let n=te.encode(f.n),d=typeof f.d==='string'?te.encode(f.d):f.d,c=crc(d),lh=cat([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),n,d]);out.push(lh);cen.push(cat([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off),n]));off+=lh.length}let cd=cat(cen);return cat([...out,cd,u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cd.length),u32(off),u16(0)])}function xlsx(kind){let rows=[];rows.push(['Постомат СИЗ — '+kind]);rows.push(['Сформирован',fmt(now())]);rows.push([]);rows.push(['Пользователь','Ячейка','СИЗ','Остаток','Min','Max','Разово','Плановая эксплуатация, дней']);db.assignments.filter(a=>a.active).forEach(a=>rows.push([emp(a.employeeId)?.name||'',a.cellId,ppe(a.ppeId)?.name||'',a.stock,a.min,a.max,a.issueQty,a.periodDays]));rows.push([]);rows.push(['Журнал выдачи']);rows.push(['Дата/время','Пользователь','Ячейка','СИЗ','Было','Взято','Осталось','Тип','Причина']);db.issueLog.forEach(x=>rows.push([fmt(x.ts),x.userName,x.cellId,x.ppeName,x.before,x.qty,x.after,x.issueType||'Обычная',x.earlyReason||'']));let sx=rows.map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>`<c r="${String.fromCharCode(65+j)}${i+1}" t="inlineStr"><is><t>${xml(v)}</t></is></c>`).join('')}</row>`).join(''),sheet=`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sx}</sheetData></worksheet>`,ct=`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`,rels=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,wb=`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Отчёт" sheetId="1" r:id="rId1"/></sheets></workbook>`,wbr=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;return zip([{n:'[Content_Types].xml',d:ct},{n:'_rels/.rels',d:rels},{n:'xl/workbook.xml',d:wb},{n:'xl/_rels/workbook.xml.rels',d:wbr},{n:'xl/worksheets/sheet1.xml',d:sheet}])}function b64(bytes){let s='',step=8192;for(let i=0;i<bytes.length;i+=step)s+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(s)}function saveFile(path,bytes){if(!folderReady()){chooseFolder();throw Error('Сначала выберите папку хранения')}let r=NativeStore.saveBase64File('/sdcard/Documents/Postomat_SIZ/'+path,b64(bytes));if(!r)throw Error('Не удалось сохранить файл');return r}function saveText(path,text){return saveFile(path,new TextEncoder().encode(text))}
function wire(tab){if(tab==='overview'&&$('equip'))$('equip').onclick=()=>modal(`<h3>Сотрудники и их оснащение</h3>${db.employees.filter(e=>e.active&&e.id!=='WH').map(e=>`<div class="card"><b>${esc(e.name)}</b><div class="sub">Ячейка: ${e.cellId?'№'+e.cellId:'—'}<br>${db.assignments.filter(a=>a.active&&a.employeeId===e.id).map(a=>esc(ppe(a.ppeId)?.name)+' — '+a.stock).join('<br>')||'СИЗ не назначены'}</div></div>`).join('')}<div class="footer"><button class="btn p" id="cancel">Закрыть</button></div>`,()=>$('cancel').onclick=closeM);if(tab==='employees'){if($('addE'))$('addE').onclick=()=>empModal();document.querySelectorAll('[data-ee]').forEach(b=>b.onclick=()=>empModal(emp(b.dataset.ee)));document.querySelectorAll('[data-te]').forEach(b=>b.onclick=()=>{let e=emp(b.dataset.te),o=e.active;e.active=!e.active;aud('Статус пользователя '+e.name,o,e.active);show('employees')})}if(tab==='cells'){if($('addC'))$('addC').onclick=()=>cellModal();document.querySelectorAll('[data-ec]').forEach(b=>b.onclick=()=>cellModal(db.cells.find(c=>+c.id===+b.dataset.ec)));document.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{let c=db.cells.find(x=>+x.id===+b.dataset.tc),o=c.active;c.active=!c.active;aud('Статус ячейки '+c.id,o,c.active);show('cells')})}if(tab==='ppe'){if($('addP'))$('addP').onclick=()=>ppeModal();document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>ppeModal(ppe(b.dataset.ep)));document.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{let p=ppe(b.dataset.tp),o=p.active;p.active=!p.active;aud('Статус СИЗ '+p.name,o,p.active);show('ppe')})}if(tab==='assign'){if($('addA'))$('addA').onclick=()=>assignModal();document.querySelectorAll('[data-ea]').forEach(b=>b.onclick=()=>assignModal(db.assignments.find(a=>a.id===b.dataset.ea)))}if(tab==='stock'){document.querySelectorAll('[data-ea]').forEach(b=>b.onclick=()=>assignModal(db.assignments.find(a=>a.id===b.dataset.ea)));document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>stockModal(db.assignments.find(a=>a.id===b.dataset.sc)))}if(tab==='sim'){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{db.sim[b.dataset.open]='OPEN';save();show('sim')});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{db.sim[b.dataset.close]='CLOSED';save();show('sim')});if($('demoOps'))$('demoOps').onclick=()=>{let a=db.assignments.find(x=>x.active);if(!a)return toast('Нет назначений','err');let e=emp(a.employeeId),p=ppe(a.ppeId);db.issueLog.unshift({ts:now(),userName:e.name,userId:e.id,cellId:a.cellId,ppeName:p.name,ppeId:p.id,before:a.stock+1,qty:1,after:a.stock,issueType:'Досрочная',earlyReason:'Повреждение',status:'Подтверждено'});db.replenishLog.unshift({ts:now(),recipientName:e.name,issuedBy:'Склад',ppeName:p.name,ppeId:p.id,qty:a.max,after:a.max,cellId:a.cellId});aud('Созданы демо-операции','','');show('sim')}}if(tab==='settings'){if($('saveSet'))$('saveSet').onclick=()=>{let o=JSON.stringify(db.settings);db.settings.criticalHours=Math.max(1,+$('crit').value||2);db.settings.normalHours=Math.max(1,+$('norm').value||24);aud('Настройки',o,JSON.stringify(db.settings));toast('Сохранено','ok')};if($('reset'))$('reset').onclick=()=>{localStorage.removeItem(K);db=defaults();save();show('overview')}}if(tab==='reports'){if($('folder'))$('folder').onclick=chooseFolder;if($('week'))$('week').onclick=()=>{try{let d=new Date(),k=d.toISOString().slice(0,10),path=saveFile('Reports/Отчет_СИЗ_НЕДЕЛЯ_'+k+'.xlsx',xlsx('Еженедельный отчёт'));db.archive.reports.unshift({ts:now(),name:'Еженедельный отчёт '+k,path});save();toast('Отчёт сохранён','ok');show('reports')}catch(e){toast(e.message,'err')}};if($('month'))$('month').onclick=()=>{try{let d=new Date(),k=d.toISOString().slice(0,7),path=saveFile('Reports/Отчет_СИЗ_'+k+'.xlsx',xlsx('Ежемесячный отчёт'));db.archive.reports.unshift({ts:now(),name:'Ежемесячный отчёт '+k,path});save();toast('Отчёт сохранён','ok');show('reports')}catch(e){toast(e.message,'err')}};if($('backup'))$('backup').onclick=()=>{try{let k=
